name: Bug report
description: Something looks wrong (a missed or wrong item, a false alarm, a crash)
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Windows, Mac] }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Windows or macOS version, placeholder: "Windows 11 24H2 / macOS 26.1" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: HexWard version, placeholder: "1.0.0-preview.1" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "What did you see, and what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: extra
    attributes: { label: Anything else?, description: "Screenshots help. For a wrong risk level, paste the item's details (Copy details button). Remove anything personal first." }
